name: tests

# Core develops on main (single-trunk, pre-alpha), so main is what CI must
# cover: every push, and every pull request targeting it. This file used to
# trigger on a `staging` branch that the repo does not use, which meant the
# library every other service depends on had no CI at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
