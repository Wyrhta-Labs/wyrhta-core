name: tests

# Core develops on main (single-trunk, pre-alpha), so main is what CI must
# cover: every push, and every pull request targeting it. This file used to
# trigger on a `staging` branch that the repo does not use, which meant the
# library every other service depends on had no CI at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # 22 is the floor the package declares support for; 24 is what the publish
    # workflow builds and releases on. Both are covered here so the release
    # toolchain is not first exercised by a tag, when a failure is expensive.
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
