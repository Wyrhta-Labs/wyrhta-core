name: publish

# Publishes @wyrhta/core to npmjs.com on a v* tag, via npm trusted publishing:
# GitHub Actions authenticates over OIDC, so there is no NPM_TOKEN secret in
# this repo to leak or rotate, and npm attaches a provenance attestation
# automatically. The trusted publisher (org, repo, and THIS workflow filename)
# is registered once in the package settings on npmjs.com, as:
#
#     organization: Wyrhta-Labs      workflow filename: publish.yml
#     repository:   wyrhta-core      environment:       (none)
#
# Renaming this file, moving the job under an `environment:`, or forking the
# repo therefore breaks publishing — and it breaks in a way that reads like
# something else entirely:
#
#     npm error 404 Not Found - PUT https://registry.npmjs.org/@wyrhta%2fcore
#     npm error 404  '@wyrhta/core@x.y.z' could not be found or you do not
#     npm error 404  have permission to access it.
#
# That 404 means the run identity did not match the registered publisher. It
# does not mean the package is missing, and it appears only after the tag
# exists, since npm's version pre-flight is client-side and passes first. If
# you hit it, fix the publisher config and re-run this workflow — the tag is
# already correct, so `gh run rerun <id> --failed` is enough.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm falls back to a token

jobs:
  publish:
    name: publish to npmjs.com
    runs-on: ubuntu-latest # trusted publishing does not work on self-hosted runners

    steps:
      - uses: actions/checkout@v7

      # No dependency cache on the publish path. A poisoned npm cache would run
      # attacker-controlled code in the job that holds the OIDC token used to
      # sign and publish, so this job restores nothing: `cache` is unset and
      # `package-manager-cache: false` also disables the automatic caching that
      # setup-node v5+ turns on by itself. `npm ci` pays a few seconds more here,
      # which is the right trade on a job that publishes to a public registry.

      # Node 24 for the bundled npm: trusted publishing needs npm >= 11.5.1, and
      # 24.x ships 11.17. Node 22 bundles npm 10, which is why this job used to
      # `npm install -g npm@latest` first — installing an unpinned npm on every
      # release, into the job that signs the tarball. The bundled npm removes
      # that moving part. The published package still supports Node >=22.12;
      # this only picks the toolchain that builds it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Fail here with a clear reason rather than deep inside `npm publish`, if a
      # future Node 24 image ever bundles an npm too old for trusted publishing.
      - name: Verify npm supports trusted publishing
        run: >-
          node -e 'const h=process.argv[1].split(".").map(Number), n=[11,5,1]; for (let i=0;i<3;i++){ if(h[i]>n[i]) break; if(h[i]<n[i]){ console.error(`npm ${process.argv[1]} is older than 11.5.1; trusted publishing needs 11.5.1+`); process.exit(1) } } console.log(`npm ${process.argv[1]} supports trusted publishing`)' "$(npm --version)"

      - name: Install
        run: npm ci

      # Publishing an untested build is how a broken tag reaches every consumer
      # at once. Core is pinned by tag, so there is no quick unpublish path.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A tag that disagrees with package.json publishes the wrong version under
      # the right name, which is close to impossible to unpick afterwards.
      - name: Verify the tag matches package.json
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag ${tag} does not match package.json ${pkg}" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
